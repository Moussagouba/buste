version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: melbet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: melbet_user
      POSTGRES_PASSWORD: melbet_secure_pass
      POSTGRES_DB: melbet_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melbet_user -d melbet_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melbet_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://melbet_user:melbet_secure_pass@postgres:5432/melbet_analytics
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      RUST_LOG: info,melbet_analytics=debug
      INITIAL_BANKROLL: 1000.00
      MELBET_COLLECTION_INTERVAL_SECS: 60
      PAPER_BETTING_AUTO_EXECUTE: "true"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: melbet_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:

